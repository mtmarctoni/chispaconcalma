name: Deploy (production)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published stable release tag to deploy (retry or rollback)
        required: true
        type: string
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      release_sha:
        required: false
        type: string

permissions: {}

# Covers resolve, build, environment approval, deploy and deployed E2E.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  resolve:
    if: vars.PRODUCTION_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: release
        run: node scripts/releases/resolve-release.mjs
        env:
          PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_SHA: ${{ inputs.release_sha }}
          GH_TOKEN: ${{ github.token }}

  build:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm validate
      - run: pnpm staging:metadata
        env:
          BUILD_SHA: ${{ needs.resolve.outputs.sha }}
      - run: pnpm staging:validate
        env:
          EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-assets
          path: dist/
          if-no-files-found: error
          retention-days: 3

  deploy:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      actions: read
    outputs:
      url: ${{ steps.assets.outputs.url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - id: assets
        run: node scripts/releases/download-artifact.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
      - run: python3 scripts/staging/extract-artifact.py production-artifact.zip production-assets
      - run: node scripts/staging/validate-assets.mjs production-assets
        env:
          EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
      - run: node scripts/staging/add-headers.mjs production-assets
      - run: node scripts/deployment/build-protected.mjs production production-assets
      - name: Recheck published tag immediately before deployment
        run: node scripts/releases/resolve-release.mjs
        env:
          PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
      - run: node scripts/deployment/deploy-protected.mjs production
        env:
          DEPLOY_SHA: ${{ needs.resolve.outputs.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_URL: ${{ steps.assets.outputs.url }}
          BASIC_AUTH_USERNAME: ${{ vars.BASIC_AUTH_USERNAME }}
          BASIC_AUTH_PASSWORD: ${{ vars.BASIC_AUTH_PASSWORD }}

  e2e:
    needs: [resolve, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy.outputs.url }}
          PRELAUNCH_AUTH_MODE: production
          BASIC_AUTH_USERNAME: ${{ vars.BASIC_AUTH_USERNAME }}
          BASIC_AUTH_PASSWORD: ${{ vars.BASIC_AUTH_PASSWORD }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
      - name: Record exact released evidence
        run: |
          {
            echo "Verified production release: $RELEASE_TAG"
            echo "Commit: $DEPLOY_SHA"
            echo "Production: $DEPLOY_URL"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          DEPLOY_SHA: ${{ needs.resolve.outputs.sha }}
          DEPLOY_URL: ${{ needs.deploy.outputs.url }}
