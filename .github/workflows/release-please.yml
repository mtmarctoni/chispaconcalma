name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    if: vars.RELEASE_AUTOMATION_ENABLED == 'true'
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-please
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Repository-scoped release App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  deploy-production:
    needs: release
    if: needs.release.outputs.release_created == 'true' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/deploy-production.yml
    with:
      release_tag: ${{ needs.release.outputs.tag_name }}
      release_sha: ${{ needs.release.outputs.sha }}
    # No inherited secrets. Production credentials belong to its Environment only.
