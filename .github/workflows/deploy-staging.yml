name: Deploy (staging)

on:
  workflow_run:
    workflows: [Checks]
    types: [completed]

permissions: {}

concurrency:
  group: main-staging
  cancel-in-progress: false

jobs:
  identify:
    if: >-
      vars.MAIN_STAGING_ENABLED == 'true' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      eligible: ${{ steps.source.outputs.eligible }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - id: source
        run: node scripts/deployment/main-context.mjs identify
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    needs: identify
    if: needs.identify.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    permissions:
      contents: read
      actions: read
    outputs:
      url: ${{ steps.source.outputs.url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - id: source
        run: node scripts/deployment/main-context.mjs download
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          EXPECTED_SHA: ${{ needs.identify.outputs.sha }}
      - run: python3 scripts/staging/extract-artifact.py staging-artifact.zip staging-assets
      - run: node scripts/staging/validate-assets.mjs staging-assets
        env:
          EXPECTED_SHA: ${{ needs.identify.outputs.sha }}
      - run: node scripts/staging/add-headers.mjs staging-assets
      - run: node scripts/deployment/build-protected.mjs staging staging-assets
      - name: Recheck current main before deployment
        run: node scripts/deployment/main-context.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          EXPECTED_SHA: ${{ needs.identify.outputs.sha }}
      - run: node scripts/deployment/deploy-protected.mjs staging
        env:
          DEPLOY_SHA: ${{ needs.identify.outputs.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_URL: ${{ steps.source.outputs.url }}
          BASIC_AUTH_USERNAME: ${{ vars.BASIC_AUTH_USERNAME }}
          BASIC_AUTH_PASSWORD: ${{ vars.BASIC_AUTH_PASSWORD }}

  e2e:
    needs: [identify, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy.outputs.url }}
          PRELAUNCH_AUTH_MODE: staging
          BASIC_AUTH_USERNAME: ${{ vars.BASIC_AUTH_USERNAME }}
          BASIC_AUTH_PASSWORD: ${{ vars.BASIC_AUTH_PASSWORD }}
          EXPECTED_SHA: ${{ needs.identify.outputs.sha }}
      - name: Record exact deployed evidence
        run: |
          {
            echo "Verified staging commit: $DEPLOY_SHA"
            echo "Staging: $DEPLOY_URL"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DEPLOY_SHA: ${{ needs.identify.outputs.sha }}
          DEPLOY_URL: ${{ needs.deploy.outputs.url }}
